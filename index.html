<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Olam Barber — Reserva tu corte</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0906">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Olam Barber">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0906;
    --panel:#18130b;
    --panel-2:#211a0f;
    --border:#3a2f1a;
    --gold-deep:#9a7226;
    --gold:#d4af37;
    --gold-bright:#f4d675;
    --text:#f7f1e3;
    --muted:#b8a97a;
    --ok:#4c9a6a;
    --danger:#c24d4d;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(212,175,55,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Outfit', sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .display{font-family:'Bebas Neue', sans-serif; letter-spacing:0.5px;}
  .gold-text{
    background:linear-gradient(120deg, var(--gold-bright) 0%, var(--gold) 45%, var(--gold-deep) 75%, var(--gold-bright) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  header.hero{
    padding:0;
    text-align:center;
    border-bottom:1px solid var(--border);
    position:relative;
    overflow:hidden;
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(400px 200px at 50% 0%, rgba(201,162,75,0.15), transparent 70%);
    pointer-events:none;
  }
  .crown-mark{
    width:34px; height:34px; margin:0 auto 10px;
    color:var(--gold);
  }
  .logo-img{
    width:100%; height:auto; display:block; margin:0 0 10px;
  }
  .brand{
    font-size:38px;
    color:var(--gold-bright);
    text-transform:uppercase;
    line-height:1;
  }
  .tagline{
    color:var(--muted);
    font-size:14px;
    font-weight:500;
    margin-top:6px;
    letter-spacing:0.4px;
  }

  main{max-width:480px; margin:0 auto; padding:20px 16px;}

  .steps{
    display:flex; justify-content:center; gap:10px;
    margin-bottom:22px;
  }
  .step-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--border);
    transition:background .25s, transform .25s;
  }
  .step-dot.active{background:var(--gold); transform:scale(1.25);}
  .step-dot.done{background:var(--gold); opacity:0.5;}

  .screen{display:none;}
  .screen.active{display:block; animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .section-title{
    font-family:'Bebas Neue', sans-serif;
    font-size:28px;
    letter-spacing:0.6px;
    margin:0 0 4px;
    background:linear-gradient(120deg, var(--gold-bright) 0%, var(--gold) 45%, var(--gold-deep) 75%, var(--gold-bright) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    display:inline-block;
  }
  .section-sub{color:var(--muted); font-size:13px; margin:0 0 20px; letter-spacing:0.2px;}
  .title-divider{
    display:flex; align-items:center; gap:10px;
    margin:6px 0 10px;
    color:var(--gold);
    font-size:13px;
  }
  .title-divider::before, .title-divider::after{
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-deep), transparent);
  }
  .banner-servicios{
    width:calc(100% + 32px); height:auto; display:block;
    margin:-4px -16px 18px;
    border-radius:0;
  }

  .card{
    background:linear-gradient(160deg, var(--panel) 0%, #14100a 100%);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }

  .service-card{
    display:flex; align-items:center; gap:12px;
    cursor:pointer;
    border-left:2px solid var(--gold);
    border-bottom:2px solid var(--gold);
    box-shadow:-6px 6px 18px -10px rgba(212,175,55,0.55);
    transition:border-color .2s, transform .15s, box-shadow .2s;
  }
  .service-card:active{transform:scale(0.98);}
  .service-card.selected{
    border-color:var(--gold);
    background:linear-gradient(160deg, var(--panel-2) 0%, #1a1409 100%);
    box-shadow:-8px 8px 22px -8px rgba(212,175,55,0.7);
  }
  .service-icon{
    flex:0 0 auto;
    width:42px; height:42px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold-bright);
  }
  .service-icon svg{width:22px; height:22px;}
  .service-name{font-weight:700; font-size:15px; flex:1; letter-spacing:0.1px;}
  .service-divider{width:1px; align-self:stretch; background:var(--border); margin:2px 0;}
  .service-meta{color:var(--muted); font-size:13px;}
  .service-price{
    font-family:'Bebas Neue', sans-serif;
    font-size:23px;
    letter-spacing:0.3px;
    white-space:nowrap;
    margin-left:12px;
    background:linear-gradient(120deg, var(--gold-bright), var(--gold) 60%, var(--gold-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .date-scroll{
    display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px;
    scrollbar-width:none;
  }
  .date-scroll::-webkit-scrollbar{display:none;}
  .date-chip{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    text-align:center;
    cursor:pointer;
    min-width:58px;
  }
  .date-chip.selected{border-color:var(--gold); background:var(--panel-2);}
  .date-chip .dow{font-size:11px; color:var(--muted); text-transform:uppercase;}
  .date-chip .num{font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--text);}

  .slots-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
  }
  .slot{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 6px;
    text-align:center;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .slot.selected{background:var(--gold); color:#181410; border-color:var(--gold);}
  .slot.disabled{opacity:0.25; pointer-events:none;}

  .empty-note{color:var(--muted); font-size:14px; text-align:center; padding:24px 10px;}

  .summary-row{
    display:flex; justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-row .label{color:var(--muted);}
  .summary-row .value{font-weight:700; letter-spacing:0.1px;}

  input[type=text], input[type=tel]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
    margin-bottom:12px;
  }
  input::placeholder{color:var(--muted);}
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}

  .btn{
    display:block; width:100%;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold) 55%, var(--gold-deep));
    color:#181410;
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.6px;
    cursor:pointer;
    text-align:center;
    box-shadow:0 8px 20px -8px rgba(212,175,55,0.5);
    transition:transform .15s, box-shadow .2s;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.35; pointer-events:none;}
  .btn.secondary{
    background:transparent;
    color:var(--gold-bright);
    border:1px solid var(--border);
    text-transform:none;
    font-weight:600;
    margin-top:10px;
  }
  .btn-row{display:flex; gap:10px; margin-top:18px;}
  .btn-row .btn{margin-top:0;}
  .back-link{
    color:var(--muted); font-size:13px; margin-bottom:14px; cursor:pointer;
    display:inline-block;
  }

  .confirm-check{
    width:64px; height:64px; margin:0 auto 16px;
    border-radius:50%;
    background:rgba(76,154,106,0.15);
    display:flex; align-items:center; justify-content:center;
  }
  .confirm-check svg{width:30px; height:30px; color:var(--ok);}
  .confirm-title{
    text-align:center; font-family:'Bebas Neue',sans-serif; font-size:29px; margin-bottom:6px; letter-spacing:0.4px;
    background:linear-gradient(120deg, var(--gold-bright), var(--gold) 55%, var(--gold-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .confirm-sub{text-align:center; color:var(--muted); font-size:14px; margin-bottom:22px;}

  .nav-bottom{
    max-width:480px; margin:24px auto 0; padding:0 16px;
    display:flex; justify-content:center; gap:24px;
  }
  .nav-link{color:var(--muted); font-size:13px; text-decoration:underline; cursor:pointer;}

  .info-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:18px; font-size:12.5px; color:var(--muted);
  }
  .info-bar a{color:var(--gold-bright); text-decoration:none; font-weight:600; white-space:nowrap;}
  .info-bar .horario-txt{line-height:1.4;}

  .loading{text-align:center; color:var(--muted); padding:30px 0; font-size:14px;}
</style>
</head>
<body>

<header class="hero">
  <img src="logo.jpg" alt="Olam Barber" class="logo-img">
</header>

<main>

  <!-- PASO 1: SERVICIOS -->
  <section class="screen active" id="screen-servicios">
    <img src="banner-servicios.jpg" alt="Elige tu servicio" class="banner-servicios">
    <div class="info-bar">
      <span class="horario-txt">Lun–Sáb 10:00–21:00<br>Dom 10:00–17:00</span>
      <a href="https://www.google.com/maps/search/?api=1&query=Olam+Barber" target="_blank">📍 Cómo llegar</a>
    </div>
    <div id="lista-servicios">
      <div class="loading">Cargando servicios…</div>
    </div>
  </section>

  <!-- PASO 2: FECHA Y HORA -->
  <section class="screen" id="screen-fecha">
    <span class="back-link" id="back-link-fecha" onclick="irPaso(1)">← Cambiar servicio</span>
    <p class="section-title">Elige día y hora</p>
    <p class="section-sub" id="servicio-elegido-label"></p>
    <div class="date-scroll" id="date-scroll"></div>
    <div class="slots-grid" id="slots-grid"></div>
  </section>

  <!-- PASO 3: DATOS + RESUMEN -->
  <section class="screen" id="screen-resumen">
    <span class="back-link" onclick="irPaso(2)">← Cambiar horario</span>
    <p class="section-title" id="titulo-resumen">Confirma tu cita</p>
    <div class="card" id="resumen-card"></div>
    <input type="text" id="input-nombre" placeholder="Tu nombre completo" maxlength="50">
    <input type="tel" id="input-telefono" placeholder="Tu teléfono" maxlength="20">
    <button class="btn" id="btn-confirmar" onclick="confirmarReserva()">Confirmar cita</button>
  </section>

  <!-- PASO 4: CONFIRMACION -->
  <section class="screen" id="screen-confirmacion">
    <div class="confirm-check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13L9 17L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="confirm-title" id="confirm-title-txt">¡Cita reservada!</p>
    <p class="confirm-sub">Te esperamos, no faltes ✂️</p>
    <div class="card" id="resumen-final-card"></div>
    <button class="btn" onclick="reiniciar()">Reservar otra cita</button>
  </section>

  <!-- MIS CITAS -->
  <section class="screen" id="screen-mis-citas">
    <span class="back-link" onclick="irPasoInterno(1)">← Volver</span>
    <p class="section-title">Mis citas</p>
    <p class="section-sub">Ingresa tu teléfono para ver, reprogramar o cancelar</p>
    <input type="tel" id="input-buscar-telefono" placeholder="Tu teléfono" maxlength="20">
    <button class="btn" onclick="buscarMisCitas()">Buscar mis citas</button>
    <div id="mis-citas-lista" style="margin-top:18px;"></div>
  </section>

</main>

<div class="nav-bottom">
  <span class="nav-link" onclick="location.reload()">Inicio</span>
  <span class="nav-link" onclick="irPasoInterno('mis-citas')">Mis citas</span>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, push, get, set, update, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCvRlNBttV1yOXMydzY3GcKLpBMo41oaE",
  authDomain: "olam-barber.firebaseapp.com",
  databaseURL: "https://olam-barber-default-rtdb.firebaseio.com",
  projectId: "olam-barber",
  storageBucket: "olam-barber.firebasestorage.app",
  messagingSenderId: "242130303381",
  appId: "1:242130303381:web:30b1ffbe8e55dae4329e9c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window.__db = db;
window.__dbRefs = { ref, push, get, set };

// ---------- CONFIG DEL NEGOCIO ----------
// Horario por día de la semana (0=domingo, 1=lunes ... 6=sábado). null = cerrado.
const HORARIO_POR_DIA = {
  0: { apertura: "10:00", cierre: "17:00" }, // domingo
  1: { apertura: "10:00", cierre: "21:00" }, // lunes
  2: { apertura: "10:00", cierre: "21:00" }, // martes
  3: { apertura: "10:00", cierre: "21:00" }, // miércoles
  4: { apertura: "10:00", cierre: "21:00" }, // jueves
  5: { apertura: "10:00", cierre: "21:00" }, // viernes
  6: { apertura: "10:00", cierre: "21:00" }  // sábado
};
const INTERVALO_MIN = 30; // slots cada 30 min

// ---------- SERVICIOS POR DEFECTO (se cargan a Firebase si no existen) ----------
const SERVICIOS_DEFAULT = {
  s1: { nombre: "Perfilado de cejas", precio: 5000, duracion: 10, activo: true },
  s2: { nombre: "Barba sola", precio: 8000, duracion: 20, activo: true },
  s3: { nombre: "Corte clásico", precio: 10000, duracion: 30, activo: true },
  s4: { nombre: "Corte degradado o en tendencia", precio: 12000, duracion: 45, activo: true },
  s5: { nombre: "Corte + barba", precio: 16000, duracion: 60, activo: true },
  s6: { nombre: "Corte + barba + cejas", precio: 18000, duracion: 60, activo: true }
};

let servicios = {};
let citasDelDia = {};
let bloqueosDelDia = {};
let diasCerrados = {};
let bloqueosRecurrentes = {};
let estado = { servicioId: null, fecha: null, hora: null };
let reprogramando = null; // { fechaOriginal, idOriginal, nombre, telefono }

const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function formatoMoneda(n){
  return "$" + Number(n).toLocaleString("es-CL");
}

async function cargarServicios(){
  const [snap, snapCerrados, snapRecurrentes] = await Promise.all([
    get(ref(db, "servicios")),
    get(ref(db, "diasCerrados")),
    get(ref(db, "bloqueosRecurrentes"))
  ]);
  if (snap.exists()){
    servicios = snap.val();
  } else {
    servicios = SERVICIOS_DEFAULT;
    await set(ref(db, "servicios"), SERVICIOS_DEFAULT);
  }
  diasCerrados = snapCerrados.exists() ? snapCerrados.val() : {};
  bloqueosRecurrentes = snapRecurrentes.exists() ? snapRecurrentes.val() : {};

  const nombreGuardado = localStorage.getItem("olamBarberNombre");
  const telefonoGuardado = localStorage.getItem("olamBarberTelefono");
  if (nombreGuardado) document.getElementById("input-nombre").value = nombreGuardado;
  if (telefonoGuardado){
    document.getElementById("input-telefono").value = telefonoGuardado;
    document.getElementById("input-buscar-telefono").value = telefonoGuardado;
  }

  renderServicios();
}

function iconoParaServicio(nombre){
  const n = nombre.toLowerCase();
  if (n.includes("ceja")) return `<path d="M4 15c2-4 5-6 8-6s6 2 8 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M6 9l3-2M18 9l-3-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`;
  if (n.includes("barba") && !n.includes("corte")) return `<circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M6 10c0 5 2.5 9 6 9s6-4 6-9" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
  if (n.includes("degrad") || n.includes("tendencia")) return `<path d="M12 3v4M12 21v-4M4.2 7.8l2.8 2.8M17 13.4l2.8 2.8M4.2 16.2L7 13.4M17 10.6l2.8-2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/>`;
  if (n.includes("corte") && n.includes("barba")) return `<circle cx="9" cy="7" r="2.4" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="9" cy="17" r="2.4" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M11 8.5L20 17M11 15.5L20 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`;
  return `<circle cx="7" cy="7" r="2.2" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="7" cy="17" r="2.2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M9 8.5L20 19M9 15.5L14.5 10M20 5L11 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`;
}

function renderServicios(){
  const cont = document.getElementById("lista-servicios");
  cont.innerHTML = "";
  const activos = Object.entries(servicios).filter(([id, s]) => s.activo !== false);
  if (activos.length === 0){
    cont.innerHTML = '<div class="empty-note">No hay servicios disponibles por ahora.</div>';
    return;
  }
  activos.forEach(([id, s]) => {
    const div = document.createElement("div");
    div.className = "card service-card";
    div.dataset.id = id;
    div.innerHTML = `
      <div class="service-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">${iconoParaServicio(s.nombre)}</svg>
      </div>
      <div class="service-name">${s.nombre}</div>
      <div class="service-divider"></div>
      <div class="service-price">${formatoMoneda(s.precio)}</div>
    `;
    div.onclick = () => seleccionarServicio(id);
    cont.appendChild(div);
  });
}

function seleccionarServicio(id){
  estado.servicioId = id;
  document.querySelectorAll(".service-card").forEach(c => c.classList.toggle("selected", c.dataset.id === id));
  setTimeout(() => irPaso(2), 150);
}

function irPaso(n){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const map = { 1:"screen-servicios", 2:"screen-fecha", 3:"screen-resumen", 4:"screen-confirmacion" };
  document.getElementById(map[n]).classList.add("active");
  document.querySelectorAll(".step-dot").forEach(d => {
    const step = Number(d.dataset.step);
    d.classList.toggle("active", step === n);
    d.classList.toggle("done", step < n);
  });
  if (n === 2){
    const s = servicios[estado.servicioId];
    document.getElementById("servicio-elegido-label").textContent = `${s.nombre} · ${formatoMoneda(s.precio)}`;
    renderFechas();
  }
}

function renderFechas(){
  const cont = document.getElementById("date-scroll");
  cont.innerHTML = "";
  const hoy = new Date();
  let primerDiaValido = null;
  for (let i=0; i<14; i++){
    const d = new Date(hoy);
    d.setDate(hoy.getDate() + i);
    const diaSemana = d.getDay();
    if (!HORARIO_POR_DIA[diaSemana]) continue;
    const iso = d.toISOString().slice(0,10);
    if (diasCerrados[iso]) continue;
    if (!primerDiaValido) primerDiaValido = iso;
    const chip = document.createElement("div");
    chip.className = "date-chip";
    chip.dataset.fecha = iso;
    chip.innerHTML = `<div class="dow">${DIAS[diaSemana]}</div><div class="num">${d.getDate()}</div>`;
    chip.onclick = () => seleccionarFecha(iso);
    cont.appendChild(chip);
  }
  if (primerDiaValido) seleccionarFecha(primerDiaValido);
  else document.getElementById("slots-grid").innerHTML = '<div class="empty-note">No hay días disponibles próximamente.</div>';
}

async function seleccionarFecha(iso){
  estado.fecha = iso;
  estado.hora = null;
  document.querySelectorAll(".date-chip").forEach(c => c.classList.toggle("selected", c.dataset.fecha === iso));
  const grid = document.getElementById("slots-grid");
  grid.innerHTML = '<div class="loading">Buscando horas libres…</div>';

  const snap = await get(ref(db, "citas/" + iso));
  citasDelDia = snap.exists() ? snap.val() : {};
  const snapBloqueos = await get(ref(db, "bloqueos/" + iso));
  bloqueosDelDia = snapBloqueos.exists() ? snapBloqueos.val() : {};
  renderSlots();
}

function minutosDesde(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h*60 + m;
}
function minutosAHHMM(min){
  const h = Math.floor(min/60).toString().padStart(2,"0");
  const m = (min%60).toString().padStart(2,"0");
  return `${h}:${m}`;
}

function renderSlots(){
  const grid = document.getElementById("slots-grid");
  grid.innerHTML = "";
  const servicio = servicios[estado.servicioId];
  const duracion = servicio.duracion;
  const diaSemana = new Date(estado.fecha + "T00:00:00").getDay();
  const horarioHoy = HORARIO_POR_DIA[diaSemana];
  const inicio = minutosDesde(horarioHoy.apertura);
  const fin = minutosDesde(horarioHoy.cierre);

  const ocupados = Object.values(citasDelDia)
    .filter(c => c.estado !== "cancelada")
    .map(c => ({ ini: minutosDesde(c.hora), fin: minutosDesde(c.hora) + Number(c.duracion) }));

  const bloqueos = Object.values(bloqueosDelDia)
    .map(b => ({ ini: minutosDesde(b.horaInicio), fin: minutosDesde(b.horaFin) }));

  const recurrentes = Object.values(bloqueosRecurrentes)
    .map(b => ({ ini: minutosDesde(b.horaInicio), fin: minutosDesde(b.horaFin) }));

  const ocupadosTotal = ocupados.concat(bloqueos).concat(recurrentes);

  const esHoy = estado.fecha === new Date().toISOString().slice(0,10);
  const ahoraMin = new Date().getHours()*60 + new Date().getMinutes();

  let huboSlots = false;
  for (let t = inicio; t + duracion <= fin; t += INTERVALO_MIN){
    const chocaConOcupado = ocupadosTotal.some(o => t < o.fin && (t+duracion) > o.ini);
    const yaPaso = esHoy && t <= ahoraMin;
    if (chocaConOcupado || yaPaso) continue;
    huboSlots = true;
    const btn = document.createElement("div");
    btn.className = "slot";
    btn.textContent = minutosAHHMM(t);
    btn.onclick = () => seleccionarHora(minutosAHHMM(t), btn);
    grid.appendChild(btn);
  }
  if (!huboSlots){
    grid.innerHTML = '<div class="empty-note">No quedan horas disponibles este día. Prueba otra fecha.</div>';
  }
}

function seleccionarHora(hora, el){
  estado.hora = hora;
  document.querySelectorAll(".slot").forEach(s => s.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(() => irPaso(3), 150);
}

function fechaLegible(iso){
  const d = new Date(iso + "T00:00:00");
  return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
}

window.irPaso = function(n){
  if (n === 3){
    const s = servicios[estado.servicioId];
    document.getElementById("resumen-card").innerHTML = `
      <div class="summary-row"><span class="label">Servicio</span><span class="value">${s.nombre}</span></div>
      <div class="summary-row"><span class="label">Fecha</span><span class="value">${fechaLegible(estado.fecha)}</span></div>
      <div class="summary-row"><span class="label">Hora</span><span class="value">${estado.hora}</span></div>
      <div class="summary-row"><span class="label">Precio</span><span class="value">${formatoMoneda(s.precio)}</span></div>
    `;
    document.getElementById("titulo-resumen").textContent = reprogramando ? "Confirma el nuevo horario" : "Confirma tu cita";
    document.getElementById("btn-confirmar").textContent = reprogramando ? "Guardar nuevo horario" : "Confirmar cita";
    if (reprogramando){
      document.getElementById("input-nombre").value = reprogramando.nombre;
      document.getElementById("input-telefono").value = reprogramando.telefono;
    }
  }
  irPasoInterno(n);
};
function irPasoInterno(n){
  document.querySelectorAll(".screen").forEach(sc => sc.classList.remove("active"));
  const map = { 1:"screen-servicios", 2:"screen-fecha", 3:"screen-resumen", 4:"screen-confirmacion", "mis-citas":"screen-mis-citas" };
  document.getElementById(map[n]).classList.add("active");
  document.querySelectorAll(".step-dot").forEach(d => {
    const step = Number(d.dataset.step);
    d.classList.toggle("active", step === n);
    d.classList.toggle("done", step < n);
  });
  const backFecha = document.getElementById("back-link-fecha");
  if (n === 2){
    backFecha.textContent = reprogramando ? "← Cancelar reprogramación" : "← Cambiar servicio";
    backFecha.onclick = reprogramando ? () => { reprogramando = null; irPasoInterno('mis-citas'); } : () => irPaso(1);
    renderFechas();
  }
  window.scrollTo(0,0);
}
window.irPasoInterno = irPasoInterno;

window.buscarMisCitas = async function(){
  const telInput = document.getElementById("input-buscar-telefono").value.trim();
  const cont = document.getElementById("mis-citas-lista");
  if (!telInput){
    alert("Ingresa tu número de teléfono.");
    return;
  }
  localStorage.setItem("olamBarberTelefono", telInput);
  cont.innerHTML = '<div class="loading">Buscando…</div>';

  const soloDigitos = telInput.replace(/\D/g, "");
  const snap = await get(ref(db, "citas"));
  if (!snap.exists()){
    cont.innerHTML = '<div class="empty-note">No encontramos citas con ese número.</div>';
    return;
  }

  const todasFechas = snap.val();
  const hoyIso = new Date().toISOString().slice(0,10);
  const resultados = [];
  Object.entries(todasFechas).forEach(([fecha, citas]) => {
    if (fecha < hoyIso) return;
    Object.entries(citas).forEach(([id, c]) => {
      const citaDigitos = (c.telefono || "").replace(/\D/g, "");
      if (citaDigitos === soloDigitos && c.estado !== "cancelada"){
        resultados.push({ fecha, id, ...c });
      }
    });
  });
  resultados.sort((a,b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));

  if (resultados.length === 0){
    cont.innerHTML = '<div class="empty-note">No encontramos citas próximas con ese número.</div>';
    return;
  }

  cont.innerHTML = "";
  resultados.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="summary-row"><span class="label">Servicio</span><span class="value">${c.servicioNombre}</span></div>
      <div class="summary-row"><span class="label">Fecha</span><span class="value">${fechaLegible(c.fecha)}</span></div>
      <div class="summary-row"><span class="label">Hora</span><span class="value">${c.hora}</span></div>
      <div class="summary-row"><span class="label">Estado</span><span class="value">${c.estado}</span></div>
      <div class="btn-row">
        <button class="btn secondary" onclick="iniciarReprogramacion('${c.fecha}','${c.id}','${(c.nombre||"").replace(/'/g,"")}','${c.telefono}','${c.servicioId}')">Reprogramar</button>
        <button class="btn secondary" onclick="cancelarMiCita('${c.fecha}','${c.id}', this)">Cancelar</button>
      </div>
    `;
    cont.appendChild(card);
  });
};

window.iniciarReprogramacion = function(fecha, id, nombre, telefono, servicioId){
  reprogramando = { fechaOriginal: fecha, idOriginal: id, nombre, telefono };
  estado = { servicioId, fecha: null, hora: null };
  irPasoInterno(2);
};

window.cancelarMiCita = async function(fecha, id, btn){
  if (!confirm("¿Estás seguro de que quieres cancelar tu cita?")) return;
  btn.disabled = true;
  btn.textContent = "Cancelando…";
  await update(ref(db, `citas/${fecha}/${id}`), { estado: "cancelada" });
  buscarMisCitas();
};

window.confirmarReserva = async function(){
  const nombre = document.getElementById("input-nombre").value.trim();
  const telefono = document.getElementById("input-telefono").value.trim();
  if (!nombre || !telefono){
    alert("Por favor completa tu nombre y teléfono.");
    return;
  }
  const btn = document.getElementById("btn-confirmar");
  btn.disabled = true;
  btn.textContent = reprogramando ? "Guardando…" : "Reservando…";

  const s = servicios[estado.servicioId];
  const nuevaCita = {
    nombre, telefono,
    servicioId: estado.servicioId,
    servicioNombre: s.nombre,
    hora: estado.hora,
    duracion: s.duracion,
    precio: s.precio,
    estado: "pendiente",
    creada: Date.now()
  };

  try{
    const nuevaRef = push(ref(db, "citas/" + estado.fecha));
    await set(nuevaRef, nuevaCita);

    if (reprogramando){
      await remove(ref(db, `citas/${reprogramando.fechaOriginal}/${reprogramando.idOriginal}`));
    }

    localStorage.setItem("olamBarberNombre", nombre);
    localStorage.setItem("olamBarberTelefono", telefono);

    document.getElementById("resumen-final-card").innerHTML = `
      <div class="summary-row"><span class="label">Servicio</span><span class="value">${s.nombre}</span></div>
      <div class="summary-row"><span class="label">Fecha</span><span class="value">${fechaLegible(estado.fecha)}</span></div>
      <div class="summary-row"><span class="label">Hora</span><span class="value">${estado.hora}</span></div>
      <div class="summary-row"><span class="label">Precio</span><span class="value">${formatoMoneda(s.precio)}</span></div>
    `;
    document.getElementById("confirm-title-txt").textContent = reprogramando ? "¡Cita reprogramada!" : "¡Cita reservada!";
    reprogramando = null;
    irPasoInterno(4);
  } catch(err){
    alert("Hubo un problema. Intenta de nuevo.");
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Confirmar cita";
  }
};

window.reiniciar = function(){
  estado = { servicioId: null, fecha: null, hora: null };
  reprogramando = null;
  document.getElementById("input-nombre").value = localStorage.getItem("olamBarberNombre") || "";
  document.getElementById("input-telefono").value = localStorage.getItem("olamBarberTelefono") || "";
  document.querySelectorAll(".service-card").forEach(c => c.classList.remove("selected"));
  irPasoInterno(1);
};

cargarServicios();
</script>
